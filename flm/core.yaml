loading:
  startup: Read every resident entry completely at launch and after compaction.
  themes_and_topics: Retrieve when the question needs their organizing context.
  guides: >-
    Read only guides whose conditions in recall.md apply to the current task.
    After compaction, restore still-applicable selected guides before pending work.
    Being listed or linked does not itself require loading.
    Follow further references only for missing task-relevant context
    or an explicit operational reading requirement.
  context: Restore operator, project, task, and working mode separately.
